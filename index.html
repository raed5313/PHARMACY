<script>
const KEY='atlas-pharmacy-v2';
const SUPABASE_URL='https://lkasfuvcdudacmmflicr.supabase.co';
const SUPABASE_KEY='sb_publishable_PLT7iRCDcdMVvD_LKnH0ww_y1IKJbQ7';
const cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentRole='pending',cloudSnapshot={products:[],customers:[],suppliers:[],sales:[],purchases:[]},authMode='login',cloudBusy=false;
const initial={products:[],sales:[],purchases:[],customers:[],suppliers:[],settings:{name:'ATLAS PHARMACY',currency:'د.ع'}};
let db=load(),page='dashboard',edit={type:null,id:null},cart=[];
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render();if(currentUser&&!cloudBusy)cloudPersist().catch(e=>toast('تعذر الحفظ السحابي: '+(e.message||'تحقق من الاتصال')));}
function money(n){return (Number(n)||0).toLocaleString('en-US')+' د.ع'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function id(){return crypto.randomUUID()}
function canManage(type){const rules={products:['manager','pharmacist'],sales:['manager','pharmacist'],purchases:['manager','accountant'],customers:['manager','pharmacist','accountant'],suppliers:['manager','accountant'],users:['manager'],settings:['manager','pharmacist','accountant'],reports:['manager','pharmacist','accountant']};return (rules[type]||[]).includes(currentRole)}\nfunction canAccessPage(p){return p==='dashboard'||canManage(p)}\nfunction setPage(p){if(!canAccessPage(p)){toast('ليست لديك صلاحية الوصول إلى هذه الصفحة');return;}page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}

function render(){document.getElementById('pageTitle').textContent=titles[page]||'';let v=document.getElementById('view');let out=({dashboard:dashboard,products:productsPage,sales:salesPage,purchases:purchasesPage,customers:customersPage,suppliers:suppliersPage,reports:reportsPage,settings:settingsPage,users:usersPage}[page]||dashboard)();if(out&&typeof out.then==='function'){v.innerHTML='<div class="panel empty">جارٍ تحميل البيانات...</div>';out.then(html=>{if(page==='users')v.innerHTML=html;}).catch(e=>toast(e.message));}else v.innerHTML=out;}
function dashboard(){
 let stock=db.products.reduce((a,p)=>a+(+p.qty||0),0),low=db.products.filter(p=>(+p.qty||0)<=(+p.min||5)).length;
 let today=new Date().toDateString(),todaySales=db.sales.filter(s=>new Date(s.date).toDateString()===today),total=todaySales.reduce((a,s)=>a+(+s.total||0),0);
 let near=db.products.filter(p=>p.expiry&&((new Date(p.expiry)-Date.now())/86400000)<90).length;
 return head('نظرة عامة','ملخص حركة الصيدلية اليوم',canManage('products')?btn('＋ إضافة دواء',"openForm('products')",'gold'):'')+
 '<div class="stats">'+statsCard('عدد أصناف الأدوية',db.products.length,'💊','إجمالي الأصناف المسجلة')+statsCard('إجمالي الوحدات',stock.toLocaleString('en-US'),'📦','الكمية المتوفرة بالمخزن')+statsCard('مبيعات اليوم',money(total),'💰',todaySales.length+' فاتورة')+statsCard('تنبيهات المخزون',low+near,'⚠️',low+' منخفض · '+near+' قريب الانتهاء')+'</div>'+
 '<div class="grid2"><div class="panel"><div class="panelhead"><h3>آخر المبيعات</h3><button class="btn soft" onclick="setPage(\'sales\')">عرض الكل</button></div>'+salesTable(db.sales.slice(-5).reverse())+'</div><div class="panel"><div class="panelhead"><h3>إجراءات سريعة</h3></div><div class="quick">'+(canAccessPage('sales')?'<button onclick="setPage(\\'sales\\')"><b>🛒</b>بيع جديد</button>':'')+(canManage('products')?'<button onclick="openForm(\\'products\\')"><b>💊</b>إضافة دواء</button>':'')+(canAccessPage('purchases')?'<button onclick="setPage(\\'purchases\\')"><b>📦</b>مشتريات</button>':'')+'</div><div class="receipt"><div class="panelhead"><h3>تنبيهات المخزون</h3><span class="pill low">'+low+' أصناف</span></div>'+ (db.products.filter(p=>(+p.qty||0)<=(+p.min||5)).slice(0,4).map(p=>'<p style="font-size:11px;display:flex;justify-content:space-between"><b>'+esc(p.name)+'</b><span class="muted">'+p.qty+' متبقي</span></p>').join('')||'<p class="muted" style="font-size:11px">لا توجد تنبيهات حالياً</p>')+'</div></div></div>';
}
function productsPage(){
 let q=(document.getElementById('qproducts')?.value||'').toLowerCase();
 let rows=db.products.filter(p=>(p.name+' '+(p.code||'')+' '+(p.category||'')).toLowerCase().includes(q));
 return head('الأدوية والمخزون','إدارة الأصناف والكميات وأسعار البيع وتواريخ الانتهاء',(['manager','pharmacist'].includes(currentRole)?btn('＋ إضافة دواء',"openForm('products')") : ''))+
 '<div class="panel"><div class="toolbar"><input id="qproducts" class="field search" placeholder="ابحث باسم الدواء أو الرمز..." oninput="filterProducts()" value="'+esc(q)+'"><select class="field" onchange="filterStock(this.value)"><option value="all">كل الأصناف</option><option value="low">مخزون منخفض</option></select></div><div class="tablewrap"><table><thead><tr><th>الدواء</th><th>الرمز</th><th>التصنيف</th><th>الكمية</th><th>سعر الشراء</th><th>سعر البيع</th><th>الانتهاء</th><th>إجراءات</th></tr></thead><tbody id="productRows">'+productRows(rows)+'</tbody></table></div></div>';
}

function filterProducts(){let q=document.getElementById('qproducts').value.toLowerCase();document.getElementById('productRows').innerHTML=productRows(db.products.filter(p=>(p.name+' '+(p.code||'')+' '+(p.category||'')).toLowerCase().includes(q)))}

function salesPage(){
 return head('المبيعات ونقطة البيع','أنشئ فاتورة، أضف الأصناف، واحسب الإجمالي تلقائياً')+
 '<div class="grid2"><div class="panel"><div class="panelhead"><h3>إضافة أصناف للفاتورة</h3></div><div class="formgroup"><label>اختر الدواء</label><select id="saleProduct" class="field">'+db.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · متوفر '+p.qty+' · '+money(p.price)+'</option>').join('')+'</select></div><div class="toolbar" style="margin-top:12px"><input id="saleQty" class="field" type="number" min="1" value="1" style="width:90px"><button class="btn primary" onclick="addCart()">إضافة للفاتورة</button></div><div id="cartItems">'+cartHtml()+'</div></div><div class="panel"><div class="panelhead"><h3>بيانات الفاتورة</h3></div><div class="formgroup"><label>اسم الزبون (اختياري)</label><input id="saleCustomer" class="field" list="customerList" placeholder="زبون نقدي"></div><datalist id="customerList">'+db.customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist><div class="receipt"><div style="display:flex;justify-content:space-between;margin:15px 0"><span class="muted">عدد الأصناف</span><b>'+cart.reduce((a,x)=>a+x.qty,0)+'</b></div><div style="display:flex;justify-content:space-between;font-size:19px"><b>الإجمالي</b><strong>'+money(cart.reduce((a,x)=>a+x.price*x.qty,0))+'</strong></div><button class="btn primary" style="width:100%;justify-content:center;margin-top:20px" onclick="completeSale()">إتمام البيع وحفظ الفاتورة</button><button class="btn soft" style="width:100%;justify-content:center;margin-top:8px" onclick="cart=[];render()">إفراغ الفاتورة</button></div></div></div><div class="panel"><div class="panelhead"><h3>سجل المبيعات</h3></div>'+salesTable(db.sales.slice().reverse())+'</div>';
}
function cartHtml(){return cart.length?'<div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الكمية</th><th>المجموع</th><th></th></tr></thead><tbody>'+cart.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+x.qty+'</td><td>'+money(x.price*x.qty)+'</td><td><button class="iconbtn" onclick="cart.splice('+i+',1);render()">✕</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">لم تتم إضافة أصناف للفاتورة</div>'}
function addCart(){let p=db.products.find(x=>x.id===document.getElementById('saleProduct')?.value),qty=+(document.getElementById('saleQty')?.value||1);if(!p)return toast('أضف دواء أولاً');if(qty<1||qty>p.qty)return toast('الكمية المطلوبة غير متوفرة');let x=cart.find(x=>x.id===p.id);if(x){if(x.qty+qty>p.qty)return toast('الكمية المطلوبة أكبر من المخزون');x.qty+=qty}else cart.push({id:p.id,name:p.name,price:+p.price,qty});render()}
function completeSale(){if(!canManage('sales'))return toast('ليست لديك صلاحية لإتمام البيع');if(!cart.length)return toast('أضف صنفاً واحداً على الأقل');for(let x of cart){let p=db.products.find(p=>p.id===x.id);if(!p||p.qty<x.qty)return toast('المخزون غير كافٍ للصنف '+x.name)}cart.forEach(x=>{let p=db.products.find(p=>p.id===x.id);p.qty-=x.qty});let s={id:id(),no:db.sales.length+1,date:new Date().toISOString(),customer:document.getElementById('saleCustomer').value,total:cart.reduce((a,x)=>a+x.price*x.qty,0),items:cart};db.sales.push(s);cart=[];save();toast('تم حفظ الفاتورة وتحديث المخزون')}
function purchasesPage(){return head('المشتريات','تسجيل توريد الأدوية وإضافة الكميات إلى المخزون',btn('＋ تسجيل مشتريات',"openForm('purchases')"))+'<div class="panel"><div class="panelhead"><h3>سجل المشتريات</h3></div><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>المجهز</th><th>الصنف</th><th>الكمية</th><th>سعر الشراء</th><th>الإجمالي</th></tr></thead><tbody>'+(db.purchases.length?db.purchases.slice().reverse().map(p=>'<tr><td>'+esc(p.date)+'</td><td>'+esc(p.supplier||'—')+'</td><td>'+esc(p.productName)+'</td><td>'+p.qty+'</td><td>'+money(p.buy)+'</td><td>'+money(p.qty*p.buy)+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">لا توجد مشتريات مسجلة</td></tr>')+'</tbody></table></div></div>'}
function customersPage(){return head('الزبائن','إدارة بيانات الزبائن ووسائل الاتصال',btn('＋ إضافة زبون',"openForm('customers')"))+'<div class="panel"><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>'+entityRows('customers',['name','phone','address','notes'])+'</tbody></table></div></div>'}
function suppliersPage(){return head('المجهزون','إدارة شركات ومجهزي الأدوية',btn('＋ إضافة مجهز',"openForm('suppliers')"))+'<div class="panel"><div class="tablewrap"><table><thead><tr><th>اسم المجهز</th><th>الهاتف</th><th>العنوان</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>'+entityRows('suppliers',['name','phone','address','notes'])+'</tbody></table></div></div>'}
function entityRows(type,fields){let a=db[type];return a.length?a.map(x=>'<tr>'+fields.map(f=>'<td>'+esc(x[f]||'—')+'</td>').join('')+'<td><div class="actions"><button class="iconbtn" onclick="openForm(\''+type+'\',\''+x.id+'\')">✎</button><button class="iconbtn" onclick="del(\''+type+'\',\''+x.id+'\')">✕</button></div></td></tr>').join(''):'<tr><td colspan="5" class="empty">لا توجد بيانات مسجلة</td></tr>'}
function reportsPage(){let revenue=db.sales.reduce((a,s)=>a+s.total,0),cost=db.purchases.reduce((a,p)=>a+p.qty*p.buy,0);return head('التقارير','ملخص المبيعات والمشتريات وحالة المخزون')+'<div class="stats">'+statsCard('إجمالي المبيعات',money(revenue),'💰')+statsCard('إجمالي المشتريات',money(cost),'📦')+statsCard('عدد الفواتير',db.sales.length,'🧾')+statsCard('عدد الأدوية',db.products.length,'💊')+'</div><div class="panel"><div class="panelhead"><h3>تفاصيل المبيعات</h3><button class="btn soft" onclick="window.print()">طباعة التقرير</button></div>'+salesTable(db.sales.slice().reverse())+'</div><div class="panel"><div class="panelhead"><h3>الأصناف منخفضة المخزون</h3></div><div class="tablewrap"><table><thead><tr><th>الدواء</th><th>المتوفر</th><th>الحد الأدنى</th></tr></thead><tbody>'+(db.products.filter(p=>p.qty<=p.min).map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.qty+'</td><td>'+p.min+'</td></tr>').join('')||'<tr><td colspan="3" class="empty">لا توجد أصناف منخفضة</td></tr>')+'</tbody></table></div></div>'}
function settingsPage(){return head('الإعدادات والنسخ الاحتياطي','احتفظ بنسخة من بياناتك واستعدها عند الحاجة')+'<div class="panel"><h3>بيانات الصيدلية</h3><div class="formgrid" style="margin-top:15px"><div class="formgroup"><label>اسم الصيدلية</label><input class="field" id="settingName" value="'+esc(db.settings.name)+'"></div><div class="formgroup"><label>العملة</label><input class="field" id="settingCurrency" value="'+esc(db.settings.currency)+'"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveSettings()">حفظ الإعدادات</button></div><div class="panel"><h3>النسخ الاحتياطي</h3><p class="muted" style="font-size:12px;line-height:1.9">يمكنك تنزيل نسخة من بيانات الصيدلية أو استيراد نسخة سابقة. احفظ النسخة في مكان آمن بشكل دوري.</p><button class="btn primary" onclick="backup()">⬇ تنزيل نسخة احتياطية</button> <label class="btn soft">⬆ استعادة نسخة<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div><div class="panel"><h3>معلومات التخزين</h3><p style="font-size:12px;line-height:2;color:#6b7a90">تُحفظ بيانات الأدوية والمبيعات والمشتريات والزبائن والمجهزين في قاعدة بيانات سحابية مشتركة، وتظهر للمستخدمين المعتمدين عند تسجيل الدخول. تبقى نسخة مؤقتة على هذا الجهاز لتحسين سرعة العرض. نزّل نسخة احتياطية بشكل دوري.</p></div>'}
function saveSettings(){db.settings.name=document.getElementById('settingName').value;db.settings.currency=document.getElementById('settingCurrency').value;save();toast('تم حفظ الإعدادات')}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='atlas-pharmacy-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales)throw 0;if(confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. هل تريد المتابعة؟')){db={...initial,...x};save();toast('تمت استعادة النسخة')}}catch(err){toast('ملف النسخة غير صالح')}};r.readAsText(f)}
const schemas={products:[['name','اسم الدواء','text',1],['code','الرمز / الباركود','text'],['category','التصنيف','text'],['qty','الكمية الحالية','number',1],['min','حد التنبيه الأدنى','number'],['buy','سعر الشراء','number'],['price','سعر البيع','number',1],['expiry','تاريخ الانتهاء','date']],customers:[['name','اسم الزبون','text',1],['phone','رقم الهاتف','tel'],['address','العنوان','text'],['notes','ملاحظات','textarea']],suppliers:[['name','اسم المجهز','text',1],['phone','رقم الهاتف','tel'],['address','العنوان','text'],['notes','ملاحظات','textarea']],purchases:[['supplier','اسم المجهز','text'],['productId','الدواء','select',1],['qty','الكمية المضافة','number',1],['buy','سعر شراء الوحدة','number',1],['date','التاريخ','date',1]]};
function openForm(type,recordId){if(!canManage(type))return toast('ليست لديك صلاحية لتنفيذ هذا الإجراء');let schema=schemas[type],record=recordId?db[type].find(x=>x.id===recordId):{};if(!schema)return;edit={type,id:recordId||null};document.getElementById('modalTitle').textContent=(recordId?'تعديل':'إضافة')+' '+({products:'دواء',customers:'زبون',suppliers:'مجهز',purchases:'مشتريات'}[type]);document.getElementById('modalFields').innerHTML=schema.map(([k,label,t,req])=>{let value=record?.[k]??(k==='date'?new Date().toISOString().slice(0,10):'');let input=t==='textarea'?'<textarea class="field" name="'+k+'" rows="2">'+esc(value)+'</textarea>':t==='select'?'<select class="field" name="'+k+'">'+db.products.map(p=>'<option value="'+p.id+'" '+(value===p.id?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>':'<input class="field" name="'+k+'" type="'+t+'" value="'+esc(value)+'" '+(req?'required':'')+' '+(t==='number'?'min="0" step="any"':'')+'>';return '<div class="formgroup '+(t==='textarea'?'full':'')+'"><label>'+label+'</label>'+input+'</div>'}).join('');document.getElementById('modalback').classList.add('show')}
document.getElementById('cancelModal').onclick=()=>document.getElementById('modalback').classList.remove('show');
document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();let type=edit.type;if(!canManage(type))return toast('ليست لديك صلاحية لتنفيذ هذا الإجراء');let data=Object.fromEntries(new FormData(e.target).entries());for(let k of Object.keys(data))if(['qty','min','buy','price'].includes(k))data[k]=+data[k];if(type==='purchases'){let p=db.products.find(p=>p.id===data.productId);if(!p)return toast('أضف دواء أولاً');p.qty+=data.qty;data.productName=p.name;db.purchases.push({id:id(),...data});}else if(edit.id){Object.assign(db[type].find(x=>x.id===edit.id),data)}else db[type].push({id:id(),...data});document.getElementById('modalback').classList.remove('show');save();toast('تم حفظ البيانات بنجاح')};
function del(type,recordId){if(!canManage(type))return toast('ليست لديك صلاحية لحذف هذا السجل');if(!confirm('هل أنت متأكد من حذف هذا السجل؟'))return;db[type]=db[type].filter(x=>x.id!==recordId);save();toast('تم الحذف')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

// Cloud database and authentication
function showAuth(message=''){document.getElementById('authScreen').style.display='grid';document.querySelector('.app').style.display='none';document.getElementById('authMessage').textContent=message}
function showApp(){document.getElementById('authScreen').style.display='none';document.querySelector('.app').style.display='flex';document.getElementById('signedUser').textContent=currentUser?.email||'';document.getElementById('usersNav').style.display=currentRole==='manager'?'flex':'none';}
document.getElementById('authToggle').onclick=()=>{authMode=authMode==='login'?'signup':'login';document.getElementById('nameGroup').style.display=authMode==='signup'?'grid':'none';document.getElementById('authSubtitle').textContent=authMode==='signup'?'إنشاء حساب المدير الأول للصيدلية':'تسجيل الدخول إلى نظام إدارة الصيدلية';document.getElementById('authSubmit').textContent=authMode==='signup'?'إنشاء الحساب':'تسجيل الدخول';document.getElementById('authToggle').textContent=authMode==='signup'?'العودة إلى تسجيل الدخول':'إنشاء حساب المدير الأول';document.getElementById('authMessage').textContent='';};
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();let email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;let msg=document.getElementById('authMessage');msg.textContent='جارٍ التحقق...';try{let result;if(authMode==='signup'){result=await cloud.auth.signUp({email,password,options:{data:{display_name:document.getElementById('authName').value.trim()}}});if(result.error)throw result.error;if(!result.data.session){msg.textContent='تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجّل الدخول.';return;}}else{result=await cloud.auth.signInWithPassword({email,password});if(result.error)throw result.error;}await initializeWorkspace();}catch(err){msg.textContent=err.message||'تعذر إكمال العملية';}};
async function logout(){if(realtimeChannel){await cloud.removeChannel(realtimeChannel);realtimeChannel=null;}await cloud.auth.signOut();currentUser=null;currentRole='pending';cart=[];showAuth('تم تسجيل الخروج.');}
async function initializeWorkspace(){let {data:{session},error}=await cloud.auth.getSession();if(error)throw error;if(!session){showAuth();return;}currentUser=session.user;let {data:profile,error:pe}=await cloud.from('user_profiles').select('display_name,app_role').eq('user_id',currentUser.id).single();if(pe)throw pe;currentRole=profile.app_role;if(currentRole==='pending'){await cloud.auth.signOut();currentUser=null;showAuth('حسابك بانتظار موافقة مدير الصيدلية.');return;}await loadCloud();showApp();applyRole();render();startRealtimeSync();}
function applyRole(){document.querySelectorAll('#nav button[data-page]').forEach(b=>{b.style.display=canAccessPage(b.dataset.page)?'flex':'none';});}
async function loadCloud(){cloudBusy=true;try{const tables=['products','customers','suppliers','sales','purchases'];const results=await Promise.all(tables.map(t=>cloud.from(t).select('*')));for(let i=0;i<tables.length;i++)if(results[i].error)throw results[i].error;
const [ps,cs,ss,sa,pu]=results.map(x=>x.data||[]);
const items=await cloud.from('sale_items').select('*');if(items.error)throw items.error;
const pitems=await cloud.from('purchase_items').select('*');if(pitems.error)throw pitems.error;
db.products=ps.map(p=>({id:p.id,name:p.name,code:p.code,category:p.category,qty:+p.quantity,min:+p.min_quantity,buy:+p.purchase_price,price:+p.sale_price,expiry:p.expiry_date}));
db.customers=cs.map(x=>({id:x.id,name:x.name,phone:x.phone,address:x.address,notes:x.notes}));
db.suppliers=ss.map(x=>({id:x.id,name:x.name,phone:x.phone,address:x.address,notes:x.notes}));
db.sales=sa.map(x=>({id:x.id,no:x.invoice_no,date:x.sold_at,customer:x.customer_name||'',total:+x.total,items:items.data.filter(it=>it.sale_id===x.id).map(it=>({id:it.product_id,name:it.product_name,qty:+it.quantity,price:+it.unit_price}))}));
db.purchases=pu.map(x=>{let it=pitems.data.find(z=>z.purchase_id===x.id);return{id:x.id,supplier:x.supplier_name,productId:it?.product_id,productName:it?.product_name||'',qty:+(it?.quantity||0),buy:+(it?.unit_cost||0),date:(x.purchased_at||'').slice(0,10)}});
cloudSnapshot=Object.fromEntries(tables.map((t,i)=>[t,results[i].data.map(x=>x.id)]));localStorage.setItem(KEY,JSON.stringify(db));
}finally{cloudBusy=false;}}
async function cloudPersist(){if(cloudBusy||!currentUser)return;cloudBusy=true;try{
const maps={
products:db.products.map(p=>({id:p.id,name:p.name,code:p.code||null,category:p.category||null,quantity:+p.qty||0,min_quantity:+p.min||0,purchase_price:+p.buy||0,sale_price:+p.price||0,expiry_date:p.expiry||null})),
customers:db.customers.map(x=>({id:x.id,name:x.name,phone:x.phone||null,address:x.address||null,notes:x.notes||null})),
suppliers:db.suppliers.map(x=>({id:x.id,name:x.name,phone:x.phone||null,address:x.address||null,notes:x.notes||null})),
sales:db.sales.map(x=>({id:x.id,invoice_no:x.no,customer_name:x.customer||null,subtotal:+x.total||0,total:+x.total||0,sold_at:x.date,created_by:currentUser.id})),
purchases:db.purchases.map(x=>({id:x.id,supplier_name:x.supplier||null,subtotal:(+x.qty||0)*(+x.buy||0),total:(+x.qty||0)*(+x.buy||0),purchased_at:x.date||new Date().toISOString(),created_by:currentUser.id}))
};
for(const t of Object.keys(maps)){if(maps[t].length){const {error}=await cloud.from(t).upsert(maps[t]);if(error)throw error;}const now=new Set(maps[t].map(x=>x.id));for(const oldId of cloudSnapshot[t]||[])if(!now.has(oldId)){const {error}=await cloud.from(t).delete().eq('id',oldId);if(error)throw error;}cloudSnapshot[t]=[...now];}
for(const sale of db.sales){const {error:de}=await cloud.from('sale_items').delete().eq('sale_id',sale.id);if(de)throw de;if(sale.items?.length){const rows=sale.items.map(it=>({sale_id:sale.id,product_id:it.id,product_name:it.name,quantity:+it.qty,unit_price:+it.price,line_total:+it.qty*+it.price}));const {error}=await cloud.from('sale_items').insert(rows);if(error)throw error;}}
for(const purchase of db.purchases){const {error:de}=await cloud.from('purchase_items').delete().eq('purchase_id',purchase.id);if(de)throw de;if(purchase.productId){const {error}=await cloud.from('purchase_items').insert({purchase_id:purchase.id,product_id:purchase.productId,product_name:purchase.productName,quantity:+purchase.qty,unit_cost:+purchase.buy,line_total:+purchase.qty*+purchase.buy});if(error)throw error;}}
}finally{cloudBusy=false;}}
let realtimeChannel=null,cloudReloading=false;
function startRealtimeSync(){
 if(realtimeChannel)cloud.removeChannel(realtimeChannel);
 const tables=['products','customers','suppliers','sales','sale_items','purchases','purchase_items'];
 realtimeChannel=cloud.channel('atlas-pharmacy-live-sync');
 tables.forEach(table=>{realtimeChannel.on('postgres_changes',{event:'*',schema:'public',table},async()=>{
  if(!currentUser||cloudBusy||cloudReloading)return;
  cloudReloading=true;
  try{await loadCloud();render();}
  catch(err){toast('تعذر تحديث البيانات المشتركة: '+(err.message||''));}
  finally{cloudReloading=false;}
 });});
 realtimeChannel.subscribe(status=>{
  if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')toast('انقطع التحديث الفوري؛ تحقق من الاتصال بالإنترنت');
 });
}
async function usersPage(){let {data,error}=await cloud.from('user_profiles').select('user_id,display_name,app_role,created_at').order('created_at');if(error)return head('المستخدمون والصلاحيات','تعذر تحميل المستخدمين');return head('المستخدمون والصلاحيات','اعتماد حسابات الموظفين وتحديد الصلاحيات')+'<div class="panel"><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>معرّف المستخدم</th><th>الصلاحية</th><th>تحديث</th></tr></thead><tbody>'+data.map(u=>'<tr><td>'+esc(u.display_name||'—')+'</td><td>'+esc(u.user_id.slice(0,8))+'…</td><td><select class="field" id="role_'+u.user_id+'"><option value="pending" '+(u.app_role==='pending'?'selected':'')+'>بانتظار الموافقة</option><option value="manager" '+(u.app_role==='manager'?'selected':'')+'>مدير</option><option value="pharmacist" '+(u.app_role==='pharmacist'?'selected':'')+'>صيدلي</option><option value="accountant" '+(u.app_role==='accountant'?'selected':'')+'>محاسب</option></select></td><td><button class="btn soft" onclick="updateRole(\''+u.user_id+'\')">حفظ</button></td></tr>').join('')+'</tbody></table></div></div>';}
async function updateRole(uid){let role=document.getElementById('role_'+uid).value;let {error}=await cloud.from('user_profiles').update({app_role:role}).eq('user_id',uid);if(error)return toast(error.message);toast('تم تحديث الصلاحية');}
